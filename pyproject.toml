[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-bot"
dynamic = ["version"]
description = "Python template for a Telegram bot that answers questions about your product from its docs and code"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22,<23",
    "httpx>=0.27",
    "razdel>=0.5.0",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-timeout>=2.4"]
# True E2E (tests_e2e): пользователь Telethon на тестовом DC. Telethon 2 - альфа
# с другим API, поэтому <2.
e2e = ["telethon>=1.45,<2", "pytest-timeout>=2.4", "qrcode>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tgbot.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
